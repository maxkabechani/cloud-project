services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hpc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-hpc_cloud}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  agent:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: agent
    environment:
      CLUSTER_AGENT_API_KEY: ${CLUSTER_AGENT_API_KEY:?CLUSTER_AGENT_API_KEY is required}
      CLUSTER_AGENT_HOST: 0.0.0.0
      CLUSTER_AGENT_PORT: 4001
    expose:
      - "4001"

  api:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: api
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_PROVIDER: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-hpc}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hpc_cloud}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://hpc-api.inbines.com}
      WEB_URL: ${WEB_URL:-https://hpc.inbines.com}
      CLOUD_PROVIDER: ${CLOUD_PROVIDER:-mock}
      DEMO_DATA: ${DEMO_DATA:-true}
      CLUSTER_AGENT_URL: http://agent:4001
      CLUSTER_AGENT_API_KEY: ${CLUSTER_AGENT_API_KEY:?CLUSTER_AGENT_API_KEY is required}
      ADMIN_NAME: ${ADMIN_NAME:-HPC Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@inbines.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_started
    expose:
      - "4000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://hpc-api.inbines.com}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000"

volumes:
  postgres-data:
